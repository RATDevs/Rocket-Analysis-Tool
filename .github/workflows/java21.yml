name: Java 21 validation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode clean verify

      - name: Install UI smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run calculation smoke test
        run: java -cp target/rocket-analysis-tool.jar rat.main.CalculationTest

      - name: Run Swing UI smoke test
        run: |
          set +e
          timeout 15s xvfb-run -a java -jar target/rocket-analysis-tool.jar > /tmp/rat-ui.log 2>&1
          status=$?
          set -e
          cat /tmp/rat-ui.log
          test "$status" -eq 0 || test "$status" -eq 124
